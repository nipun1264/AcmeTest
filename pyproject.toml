[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9.0",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0.84",
    "shapely>=2.0.6",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
pitch-engine = "pitch_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
